[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reliability-lab"
version = "0.4.0"
description = "Python analytics for a C++ Monte Carlo reliability simulator"
requires-python = ">=3.10"

[project.scripts]
reliability-analyze = "reliability_lab.cli:main"
reliability-compare = "reliability_lab.compare:main"
reliability-performance-gate = "reliability_lab.performance_gate:main"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
exclude = ["tests*"]


[project.optional-dependencies]
dev = ["build>=1.2", "mypy>=1.11", "ruff>=0.9"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["python/reliability_lab"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]