[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reliability-lab"
version = "0.1.0"
description = "Python analytics for a C++ Monte Carlo reliability simulator"
requires-python = ">=3.10"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]


[project.optional-dependencies]
dev = ["mypy>=1.11"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["python/reliability_lab"]
